name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: mypy
        run: mypy src
      - name: pytest
        env:
          PYTHONPATH: src
        run: pytest -q --maxfail=1
      - name: Guardrail invariants (must never be weakened)
        run: |
          pytest -q tests/test_allowlist.py tests/test_peer_guard.py tests/test_write_actions.py tests/test_agent.py
          grep -q '"messages.DeleteMessagesRequest"' src/app/mtproto/allowlist.py
          ! grep -rE 'def (delete|remove)_message' src/app/services/ || (echo "delete tool detected" && exit 1)

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tg-ai-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
