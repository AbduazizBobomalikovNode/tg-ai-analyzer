[project]
name = "tg-ai-analyzer"
version = "0.1.0"
description = "AI agent for analyzing, searching and managing Telegram chats via MTProto + Bot API"
requires-python = ">=3.12"

dependencies = [
    # Telegram
    "telethon>=1.44",  # layer 227+: channels.SearchPosts(query=), CheckSearchPostsFlood
    "aiogram>=3.15",
    # web / api (Mini App fallback auth)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # infra
    "redis>=5.2",
    "arq>=0.26",
    # llm
    "google-genai>=0.3",
    "anthropic>=0.122",
    # kuzatuv
    "prometheus-client>=0.21",
    # crypto / config / misc
    "cryptography>=44.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "qrcode[pil]>=8.0",
    "orjson>=3.10",
    # til aniqlash (ingest) — o'zbek tili lingua ro'yxatida yo'q, shuning uchun
    # ru/en ni lingua, uz ni marker so'zlar hal qiladi (services/ingestion.py)
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
monitoring = ["sentry-sdk[fastapi]>=2.19"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
# Bu fayllar ataylab kirill/o'zbek matnini **ma'lumot** sifatida saqlaydi
# (fold jadvallari, stop-so'zlar, paritet korpusi) — RUF001/2/3 "ASCII'ga
# o'xshash belgi" ogohlantirishlari bu yerda shovqin.
"src/app/services/stopwords.py" = ["RUF001", "RUF002", "RUF003"]
"src/app/services/textnorm.py" = ["RUF001", "RUF002", "RUF003"]
"migrations/versions/0008_retrieval_foundation.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_textnorm.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_db_integration.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ingest_normalization.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
