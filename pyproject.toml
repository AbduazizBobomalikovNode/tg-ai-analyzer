[project]
name = "tg-ai-analyzer"
version = "0.1.0"
description = "AI agent for analyzing, searching and managing Telegram chats via MTProto + Bot API"
requires-python = ">=3.12"

dependencies = [
    # Telegram
    "telethon>=1.36",
    "aiogram>=3.15",
    # web / api (Mini App fallback auth)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # infra
    "redis>=5.2",
    "arq>=0.26",
    # llm
    "google-genai>=0.3",
    "anthropic>=0.122",
    # crypto / config / misc
    "cryptography>=44.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "qrcode[pil]>=8.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert allowed in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
