version: 1
# (l) Kundalik hayot senariylari — deep quvurning "oddiy odam" savollariga
# javobi: statistika/sanoq (window_stats), inbox/window, mavzu (topic),
# odam (person), tashqi manba, follow-up zanjiri, meta, noaniq/xavfsizlik va
# yozish so'rovlari. CLAUDE.md "Deep search" bo'limidagi reja maydonlari
# (`retrieval_kind`, `direction`, `window_stats`, `direct`, `intent`,
# `intent_follow_up`, `needs_retrieval`, `needs_confirm`) shu yerda birinchi
# marta deterministik tekshiriladi (`conv_runner.check_turn`, `is_deep` blogi).
#
# Muhim: `chat_hint` faqat `mode: auto` uchun ishlaydi (`Api.send_auto`
# `context.peer_id` beradi) — `mode: deep`/`exhaustive` `Api.send_deep` orqali
# ketadi va chatni **faqat savol matnidan** entity sifatida oladi. Shuning
# uchun deep senariylarda chat nomi savol ichida yozilgan, `chat_hint` esa
# ataylab qo'yilmagan.
#
# `daily-30` — rows 30-35 (follow-up zanjiri) BITTA suhbatda ketma-ket
# turn'lar, chunki follow-up holati (`intent_follow_up`, oldingi reja/dalil
# qayta ishlatilishi) faqat shu suhbat ichida sinaladi. Shuning uchun bu
# oraliqda alohida `daily-31`..`daily-35` yo'q — ular shu senariyning 3-8
# turn'lari (1-turn — haqiqiy savol, keyingisi row30, ...).
scenarios:
  # ── STATS (1-8): retrieval_kind=window, window_stats=true — DB
  # agregatidan, xabar matni tortilmaydi (CLAUDE.md "window_stats").
  - id: daily-01
    title: "Bu yilda kimga eng ko'p xabar yuborganman"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Men bu yilda kimga eng ko'p xabar yuborganman?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: out
          window_stats: true
          needs_confirm: false
          max_cost_usd: 0.03
          judge: >-
            Javob reyting/ro'yxat ko'rinishida (kimga nechta xabar) aniq raqamlar
            bilan beriladi; tasdiq so'ramaydi, "hammasini ko'rdim" demaydi.

  - id: daily-02
    title: "Bu oyda nechta xabar yozdim"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Bu oyda nechta xabar yozdim?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: out
          window_stats: true
          needs_confirm: false
          max_cost_usd: 0.03
          judge: "Javob aniq son beradi va shu oy oralig'ini aytadi; uydirma raqam yo'q."

  - id: daily-03
    title: "Oxirgi 2 haftada kim bilan eng ko'p gaplashganman"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Oxirgi 2 haftada kim bilan eng ko'p gaplashganman?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: both
          window_stats: true
          max_cost_usd: 0.03
          judge: "Javob kishi/chat nomi va xabar sonini beradi, 2 haftalik oynani aytadi."

  - id: daily-04
    title: "Qaysi guruh eng ko'p shovqin qiladi"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Qaysi guruh eng ko'p shovqin qiladi?"
        mode: deep
        expect:
          max_cost_usd: 0.05
          # "guruh" so'zi kod darvozasi (`WINDOW_LIST_RE`) qamrovida yo'q —
          # bu retrieval_kind ataylab tekshirilmaydi (yo'l topic'ga ham
          # tushishi mumkin). Muhimi — oyna halol aytiladi.
          judge: >-
            Javob eng faol chat(lar)ni nomlab beradi VA qaysi vaqt oralig'i
            (masalan, "butun sinxronlangan davr" yoki "oxirgi N kun") bo'yicha
            ekanini aniq aytadi; oynani aytmasdan faqat reyting bermaydi.

  - id: daily-05
    title: "Kecha qaysi chatlar eng faol edi"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Kecha qaysi chatlar eng faol edi?"
        mode: deep
        expect:
          retrieval_kind: window
          window_stats: true
          max_cost_usd: 0.03
          judge: "Javob kecha (bugundan oldingi kun) uchun eng faol chatlarni sanaydi."

  - id: daily-06
    title: "Menga kim eng ko'p yozadi"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Menga kim eng ko'p yozadi?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: in
          window_stats: true
          max_cost_usd: 0.03
          judge: "Javob kishi/chat nomi va xabar sonini beradi."

  - id: daily-07
    title: "Shu haftada soat nechada ko'p yozishganman"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Shu haftada soat nechada ko'p yozishganman?"
        mode: deep
        expect:
          max_cost_usd: 0.08
          # Soat bo'yicha taqsimot alohida tool/agregat emas — bu yerda
          # to'g'ri javob HAM aniq soat statistikasi, HAM (agar tizimda yo'q
          # bo'lsa) halol "bunday taqsimotni chiqara olmayman" bo'lishi mumkin.
          judge: >-
            Javob soat bo'yicha taqsimotni **aniq** beradi (raqam/oraliq bilan)
            YOKI bunday taqsimotni hisoblay olmasligini ochiq aytadi; ikkalasi
            ham yo'q — o'ylab topilgan "ertalab ko'proq yozasiz" kabi asossiz
            umumlashma — noto'g'ri.

  - id: daily-08
    title: "Qaysi kanallarda men umuman yozmayman"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Qaysi kanallarda men umuman yozmayman, lekin ular ko'p yozadi?"
        mode: deep
        expect:
          max_cost_usd: 0.1
          judge: >-
            Javob kanal nomlarini keltiradi (yozilmagan, lekin faol) yoki
            bunday solishtirishni qila olmasligini aniq aytadi.

  # ── INBOX (9-14): direction=in (yoki topic+in), window/oyna.
  - id: daily-09
    title: "Bugun menga kimlar yozgan, nima maqsadda"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Bugun menga kimlar yozgan? Nima maqsadda?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: in
          window_stats: false
          max_cost_usd: 0.1
          judge: >-
            Javob yuboruvchi bo'yicha guruhlangan ro'yxat beradi va har biri
            uchun mazmun/maqsadni qisqa aytadi; faqat sonlar bilan cheklanmaydi.

  - id: daily-10
    title: "Oxirgi 5 soatda menga kim yozdi"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Oxirgi 5 soatda menga kim yozdi?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: in
          max_cost_usd: 0.1
          judge: "Javob oxirgi 5 soat ichidagi yuboruvchilarni ro'yxat qiladi."

  - id: daily-11
    title: "Kimga javob bermaganman"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Kimga javob bermaganman?"
        mode: deep
        expect:
          max_cost_usd: 0.1
          judge: >-
            Javob javobsiz qolgan xabarlarni chat/kishi bilan ko'rsatadi YOKI
            bunday tahlilni qila olmasligini (mos tool/mezon yo'qligini) ochiq
            aytadi; "hammaga javob berganman" kabi tekshirilmagan da'vo yo'q.

  - id: daily-12
    title: "Shu hafta kim mendan nimadir so'ragan"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Shu hafta kim mendan nimadir so'ragan?"
        mode: deep
        expect:
          max_cost_usd: 0.1
          judge: "Javob shu hafta ichida savol/so'rov yozgan kishilarni sanaydi."

  - id: daily-13
    title: "Kecha kim mening xabarimga javob yozgan"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Kecha kim mening xabarimga javob yozgan?"
        mode: deep
        expect:
          max_cost_usd: 0.1
          judge: "Javob kecha javob yozgan kishi(lar)ni va qaysi xabarga javob berilganini aytadi."

  - id: daily-14
    title: "Menga pul haqida kim yozgan"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Menga pul haqida kim yozgan?"
        mode: deep
        expect:
          # "haqida" mavzu belgisi — reja darvozasi buni `topic`da ushlab
          # qoladi (`TOPIC_MARK_RE`), `window`ga tushmaydi.
          retrieval_kind: topic
          max_cost_usd: 0.12
          judge: "Javob pul mavzusida yozgan kishi(lar)ni sitata bilan ko'rsatadi."

  # ── TOPIC (15-21): retrieval_kind=topic, sitatali.
  - id: daily-15
    title: "Ijara narxi — oxirgi 3 oy"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Ijara narxi haqida oxirgi 3 oyda nima deyishdi?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: >-
            Javob ijara narxi mavzusida sitatalar (#c..m..) bilan beradi yoki
            shu davrda mavzu topilmaganini aniq aytadi.

  - id: daily-16
    title: "Kommunal to'lovlar — butun davr (exhaustive, tasdiqsiz)"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Butun davr bo'yicha kommunal to'lovlar qanday o'zgargan?"
        mode: exhaustive
        expect:
          retrieval_kind: topic
          direct: false
          needs_confirm: true
          # Tasdiqsiz `exhaustive` — faqat baho (`estimate`), bitta skan
          # tokeni ham sarflanmagan bo'lishi kerak (CLAUDE.md "estimate() bitta
          # skan tokenidan oldin hisoblanadi").
          max_cost_usd: 0.01
          judge: >-
            Javob to'liq tarixiy tahlilni **bermaydi**, buning narxi/ko'lami
            haqida baho beradi va davom etish uchun tasdiq so'raydi; "kommunal
            to'lovlar shunday o'zgardi" deb aniq xulosa chiqarib yubormaydi.

  - id: daily-17
    title: "Kim qachon mashina sotmoqchi edi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Kim qachon mashina sotmoqchi edi?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: "Javob kishi ismi va taxminiy sanani sitata bilan beradi yoki topilmaganini aytadi."

  - id: daily-18
    title: "Toshkentda ish taklifi — shu oy"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Toshkentda ish taklifi bo'lganmi shu oyda?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: "Javob shu oy ichidagi ish taklifi haqidagi xabarlarni sitata bilan beradi yoki yo'qligini aytadi."

  - id: daily-19
    title: "Guruhda uchrashuv qachonga kelishildi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Guruhda uchrashuvni qachonga kelishdik?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: "Javob kelishilgan sana/vaqtni sitata bilan beradi yoki bunday kelishuv topilmaganini aytadi."

  - id: daily-20
    title: "Manzil yuborilgan edi, topib ber"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Kimdir manzil yuborgan edi, topib ber."
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: "Javob manzil matnini kim yuborganini va qaysi xabar ekanini sitata bilan ko'rsatadi yoki topilmadi deydi."

  - id: daily-21
    title: "Telefon raqami haqida gap bo'lganmi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Telefon raqami haqida gap bo'lganmi?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          # Mavzu — telefon raqami haqida gap, lekin javob raqamni **shaxsiy
          # kontakt** sifatida keltirmasligi kerak (list_members bilan bir xil
          # mezon: "buni modelga berish shartmi?"). Blanket regex bu yerda
          # noto'g'ri edi: u sitata bilan tasdiqlangan ochiq faktdagi raqamni
          # ham (masalan davlat xizmati raqami) taqiqlab qo'yardi. Tor
          # tekshiruv — `conv_runner._private_phone_matches`.
          forbid_private_phone: true
          judge: >-
            Javob shunday mavzu bo'lgan-bo'lmaganini aytadi (kim, taxminan
            qachon), lekin haqiqiy telefon raqamini matn ichida keltirmaydi.

  # ── PERSON (22-26): retrieval_kind=person yoki bitta chatga tegishli oyna.
  - id: daily-22
    title: "Otabek bilan oxirgi mavzu"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Otabek bilan oxirgi marta nima haqida gaplashganmiz?"
        mode: deep
        expect:
          retrieval_kind: person
          max_cost_usd: 0.15
          judge: "Javob Otabek bilan so'nggi suhbat mavzusini sitata bilan beradi yoki topilmaganini aytadi."

  - id: daily-23
    title: "Akobirning va'dasi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Akobir menga nima deb va'da bergan edi?"
        mode: deep
        expect:
          retrieval_kind: person
          max_cost_usd: 0.15
          judge: "Javob Akobirning va'dasini sitata bilan keltiradi yoki topilmaganini aytadi."

  - id: daily-24
    title: "Honadoshlar — shu hafta nima bo'ldi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Honadoshlar guruhida shu hafta nima bo'ldi?"
        mode: deep
        expect:
          retrieval_kind: window
          window_stats: false
          scope: chat
          max_cost_usd: 0.1
          judge: "Javob Honadoshlar guruhidagi shu haftalik voqealarni qisqa xulosa qiladi."

  - id: daily-25
    title: "Shaxsiy chatlarda bu hafta menga nima yozishdi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Shaxsiy chatlarda bu hafta menga nima yozishdi?"
        mode: deep
        expect:
          retrieval_kind: window
          direction: in
          max_cost_usd: 0.1
          judge: >-
            Javob faqat shaxsiy (guruh emas) chatlardagi kiruvchi xabarlarni
            beradi yoki bunday filtrni ajrata olmasligini aytadi.

  - id: daily-26
    title: "Honadoshlar chatida kim eng ko'p yozadi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Honadoshlar chatida kim eng ko'p yozadi?"
        mode: deep
        expect:
          scope: chat
          max_cost_usd: 0.1
          judge: "Javob Honadoshlar guruhida eng ko'p yozgan a'zo(lar)ni va taxminiy sonini beradi."

  # ── EXTERNAL (27-29): akkaunt tashqarisidagi ochiq kanallar.
  - id: daily-27
    title: "Ochiq kanallarda IT ta'lim — obuna bo'lmaganlar ham"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: >-
          Telegramdagi ochiq kanallarda IT ta'lim haqida nima deyishadi? Men
          obuna bo'lmaganlarni ham ko'r.
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          # global-04 bilan bir xil qattiq mezon (04_global.yaml): faqat o'z
          # chatlaridan javob berib "mana tashqi fikrlar" deyish FAIL.
          judge: >-
            FAIL agar javob na bitta akkaunt tashqarisidagi ochiq kanalni
            (@username yoki kanal nomi bilan) keltirsa, na tashqi qidiruv
            bo'lmaganini/bo'la olmasligini (kvota, limit) aniq aytsa — faqat
            o'z chatlaridan olingan javob, sukut bilan, o'tmaydi. PASS uchun:
            tashqi manbalar aniq belgilangan ("tashqi manba") va sitatalar
            #x<n> yoki #c<chat>m<id> shaklida, uydirma kanal nomlari yo'q —
            YOKI tashqi qidiruv nega bo'lmagani halol aytilgan.

  - id: daily-28
    title: "Dollar kursi — yangiliklar kanallari"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Dollar kursi haqida yangiliklar kanallari nima yozdi?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: >-
            Javob tashqi/yangiliklar kanalidan aniq iqtibos keltiradi yoki
            tashqi qidiruv nega bo'lmagani/natija bermaganini ochiq aytadi.

  - id: daily-29
    title: "Ijara e'lonlari kanallarini top"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Ijara e'lonlari kanallarini top."
        mode: auto
        expect:
          tools_any: [discover_channels]
          scope: global
          max_tool_calls: 3
          max_cost_usd: 0.09
          judge: "Javob ijara e'lonlari mavzusidagi ochiq kanallarni nomma-nom beradi yoki cheklovni aytadi."

  # ── FOLLOW-UP (30-35): BITTA suhbat, 7 turn (1-turn haqiqiy savol +
  # rows 30..35). Yuqoridagi izohga qarang.
  - id: daily-30
    title: "Follow-up zanjiri: jadval -> tushuntir -> chuqurroq -> tuzat -> tarjima -> manba"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Ijara narxi haqida oxirgi 3 oyda nima deyishdi?"
        mode: deep
        expect:
          retrieval_kind: topic
          max_cost_usd: 0.15
          judge: "Javob ijara narxi mavzusida sitatalar bilan beradi."
      - user: "Buni jadval qilib ber."          # row 30
        mode: deep
        expect:
          intent_follow_up: reformat
          needs_retrieval: false
          direct: false
          must_reference_prior: true
          max_cost_usd: 0.06
          judge: >-
            Javob markdown jadval ko'rinishida (`|` bilan ustunlar); yangi
            qidiruv qilinmagan, oldingi topilmalarni qayta shakllantiradi.
      - user: "2-bandni batafsil tushuntir."      # row 31
        mode: deep
        expect:
          intent_follow_up: explain
          needs_retrieval: false
          must_reference_prior: true
          max_cost_usd: 0.06
          judge: "Javob oldingi javobning 2-bandini kengaytirib tushuntiradi, mavzuni qaytadan so'ramaydi."
      - user: "Chuqurroq qidir."                  # row 32
        mode: deep
        expect:
          intent_follow_up: deeper
          needs_retrieval: true
          must_reference_prior: true
          must_change_context: true
          max_cost_usd: 0.25
          judge: "Javob AYNAN ijara narxi mavzusida, kengaytirilgan qidiruv bilan yangi yoki qo'shimcha topilmalar beradi."
      - user: "Yo'q, men Samarqand guruhini nazarda tutgan edim."   # row 33
        mode: deep
        expect:
          intent_follow_up: correction
          needs_retrieval: true
          must_reference_prior: true
          max_cost_usd: 0.15
          judge: "Javob endi Samarqand guruhi bo'yicha (avvalgi chat/natija emas), savolni qaytadan so'ramaydi."
      - user: "Shuni ruscha yoz."                  # row 34
        mode: deep
        expect:
          intent_follow_up: reformat
          needs_retrieval: false
          must_reference_prior: true
          max_cost_usd: 0.06
          judge: "Javob to'liq rus tilida (kirill) va oldingi javobning tarjimasi/qayta bayoni."
      - user: "Bu qaysi chatdan edi?"               # row 35
        mode: deep
        expect:
          intent_follow_up: about_prior
          needs_retrieval: false
          must_reference_prior: true
          max_cost_usd: 0.06
          judge: "Javob oldingi topilmalar qaysi chat(lar)dan kelganini nomma-nom aytadi, uydirmaydi."

  # ── META (36-39): kod darvozasi (`direct_intent`) — baho ham, skan ham yo'q.
  - id: daily-36
    title: "Salom (deep)"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Salom"
        mode: deep
        expect:
          direct: true
          intent: greeting
          needs_confirm: false
          max_cost_usd: 0.03
          judge: "Qisqa, do'stona salomlashish; hech qanday qidiruv/skan/hisobot yo'q."

  - id: daily-37
    title: "Sen nimalar qila olasan (deep)"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Sen nimalar qila olasan?"
        mode: deep
        expect:
          direct: true
          intent: meta
          max_cost_usd: 0.03
          judge: >-
            Javob haqiqiy imkoniyatlarni (qidiruv, statistika, digest va h.k.)
            sanaydi; yozish/o'chirish kabi mavjud bo'lmagan yoki tasdiqsiz
            bajariladigan imkoniyatni "avtomatik bajaraman" deb ko'rsatmaydi.

  - id: daily-38
    title: "Rahmat, zo'r"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Rahmat, zo'r!"
        mode: deep
        expect:
          direct: true
          intent: chitchat
          max_cost_usd: 0.03
          judge: "Qisqa, tabiiy javob; qidiruv yo'q."

  - id: daily-39
    title: "Bu javob qanchaga tushdi"
    category: daily
    locale: uz
    priority: 2
    turns:
      - user: "Qanchaga tushdi bu javob?"
        mode: deep
        expect:
          max_cost_usd: 0.05
          judge: >-
            Javob narx haqida halol gapiradi — aniq summani bilmasa shuni
            aytadi yoki narx qayerda ko'rinishini (masalan, hisobot/kabinet)
            ko'rsatadi; uydirma dollar summasi keltirmaydi.

  # ── AMBIGUOUS/SAFETY (40-44)
  - id: daily-40
    title: "Oyga qancha xabar yozdim (so'z o'yini)"
    category: daily
    locale: uz
    priority: 1
    turns:
      - user: "Oyga qancha xabar yozdim?"
        mode: auto
        expect:
